# Default local deployment: application, data, backups and monitoring.
# Optional overrides live in deploy/compose/ and must follow this root file.
services:
  mysql:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ai_order_assistant
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?initialize .env with start.ps1}
      MYSQL_USER: ai_order_app
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:?initialize .env with start.ps1}
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysqladmin ping -h 127.0.0.1 --protocol=TCP -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: [mysql-data:/var/lib/mysql]
  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [redis-data:/data]
  agent:
    build:
      context: ./agent-service
      args: {VCS_REF: "${APP_REVISION:-development}"}
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - agent-metrics:/app/metrics
      - ./backups/health:/app/backup-health:ro
    depends_on:
      redis: {condition: service_healthy}
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      JAVA_BASE_URL: http://gateway:9090
      EVAL_BASE_URL: http://gateway:9090
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      AGENT_INTERNAL_API_KEY: ${AGENT_INTERNAL_API_KEY:?required}
      RATE_LIMIT_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      AGENT_RATE_LIMIT_KEY_PREFIX: ai-order-agent:rate
      AGENT_TOTAL_TIMEOUT: "35"
      AGENT_MAX_CONCURRENT: ${AGENT_MAX_CONCURRENT:-8}
      AGENT_MERCHANT_CONCURRENT: ${AGENT_MERCHANT_CONCURRENT:-2}
      AGENT_MERCHANT_DAILY_TOKENS: ${AGENT_MERCHANT_DAILY_TOKENS:-2000000}
      AGENT_CAMPUS_USER_CONCURRENT: ${AGENT_CAMPUS_USER_CONCURRENT:-2}
      AGENT_CAMPUS_DAILY_TOKENS: ${AGENT_CAMPUS_DAILY_TOKENS:-2000000}
      METRICS_QUEUE_CAPACITY: ${METRICS_QUEUE_CAPACITY:-1000}
      BACKUP_HEALTH_DIRECTORY: /app/backup-health
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8800/ready',headers={'X-Agent-Internal-Key':os.environ['AGENT_INTERNAL_API_KEY']}); urllib.request.urlopen(r,timeout=3).read()"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s
  gateway:
    build:
      context: ./java-gateway
      args: {VCS_REF: "${APP_REVISION:-development}"}
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:9090:9090"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ai_order_assistant?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: ai_order_app
      DB_PASSWORD: ${DB_APP_PASSWORD}
      AI_AGENT_BASE_URL: http://agent:8800
      AI_INTERNAL_API_KEY: ${AGENT_INTERNAL_API_KEY}
      JWT_USER_SECRET: ${JWT_USER_SECRET:?required}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:?required}
      CACHE_TYPE: redis
      SPRING_DATA_REDIS_HOST: redis
      DEMO_SEED_ENABLED: ${DEMO_SEED_ENABLED:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME:-platform}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?required}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      CHECKOUT_QUOTE_RETENTION_HOURS: ${CHECKOUT_QUOTE_RETENTION_HOURS:-24}
      CHECKOUT_QUOTE_CLEANUP_BATCH_SIZE: ${CHECKOUT_QUOTE_CLEANUP_BATCH_SIZE:-500}
      CHECKOUT_QUOTE_CLEANUP_DELAY_MS: ${CHECKOUT_QUOTE_CLEANUP_DELAY_MS:-3600000}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-3000}
      DB_CONNECT_TIMEOUT_MS: ${DB_CONNECT_TIMEOUT_MS:-3000}
      DB_SOCKET_TIMEOUT_MS: ${DB_SOCKET_TIMEOUT_MS:-10000}
      DB_QUERY_TIMEOUT_SECONDS: ${DB_QUERY_TIMEOUT_SECONDS:-8}
      DB_LOCK_WAIT_SECONDS: ${DB_LOCK_WAIT_SECONDS:-5}
      SSE_SENDER_THREADS: ${SSE_SENDER_THREADS:-4}
      SSE_QUEUE_CAPACITY: ${SSE_QUEUE_CAPACITY:-200}
      RECOMMEND_MAX_CONCURRENT: ${RECOMMEND_MAX_CONCURRENT:-2}
      RECOMMEND_MAX_COMBINATIONS: ${RECOMMEND_MAX_COMBINATIONS:-64}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/actuator/health/readiness >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
  backup:
    image: mysql:8.4
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      BACKUP_EXTRA_ENABLED: ${BACKUP_EXTRA_DIRECTORY:+true}
    entrypoint: ["/bin/sh","/backup-loop.sh"]
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./deploy/backup-loop.sh:/backup-loop.sh:ro
      - ./backups:/backups
      - ./backups/health:/health
      - type: bind
        source: ${BACKUP_EXTRA_DIRECTORY:-./backups}
        target: /extra-backups
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "test -s /health/backup.prom && grep -q '^ai_order_backup_last_attempt_success 1$$' /health/backup.prom"]
      interval: 60s
      timeout: 3s
      retries: 2
      start_period: 60s
  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    entrypoint: ["/bin/sh","-c","printf '%s' \"$$AGENT_INTERNAL_API_KEY\" > /tmp/agent-key; exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=7d"]
    environment:
      AGENT_INTERNAL_API_KEY: ${AGENT_INTERNAL_API_KEY:?required}
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:19091:9090"]
    depends_on:
      gateway: {condition: service_healthy}
volumes:
  mysql-data:
  redis-data:
  agent-metrics:
  prometheus-data:
