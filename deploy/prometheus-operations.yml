global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/operations-alerts.yml
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]
scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    http_headers:
      X-Monitoring-Key:
        files: ["/tmp/monitor-key"]
    static_configs: [{ targets: ["gateway:9090"] }]
  - job_name: agent
    metrics_path: /metrics
    http_headers:
      X-Monitoring-Key:
        files: ["/tmp/monitor-key"]
    static_configs: [{ targets: ["agent:8800"] }]
  - job_name: alertmanager
    static_configs: [{ targets: ["alertmanager:9093"] }]
