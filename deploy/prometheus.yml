global:
  scrape_interval: 15s
rule_files: ["/etc/prometheus/alerts.yml"]
scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    http_headers:
      X-Agent-Internal-Key:
        files: ["/tmp/agent-key"]
    static_configs: [{targets: ["gateway:9090"]}]
  - job_name: agent
    metrics_path: /metrics
    http_headers:
      X-Agent-Internal-Key:
        files: ["/tmp/agent-key"]
    static_configs: [{targets: ["agent:8800"]}]
