# Explicit opt-in for paid provider acceptance on a disposable deployment.
# Use after root docker-compose.yml and deploy/compose/isolated.yml.
# Never put provider credentials in this file.
services:
  agent:
    environment:
      LLM_API_KEY: ${CAMPUS_EVAL_LLM_API_KEY:?Set the real provider key for this explicit evaluation}
      LLM_BASE_URL: ${CAMPUS_EVAL_LLM_BASE_URL:?Set the real provider base URL}
      LLM_MODEL: ${CAMPUS_EVAL_LLM_MODEL:?Set the real provider model}
