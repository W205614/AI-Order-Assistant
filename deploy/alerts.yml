groups:
  - name: personal-operations
    rules:
      - alert: BackupStatusUnavailable
        expr: ai_order_backup_status_available == 0 or absent(ai_order_backup_status_available)
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "备份健康状态缺失或无法读取"}
      - alert: BackupOverdue
        expr: time() - ai_order_backup_last_success_timestamp_seconds > 108000
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "超过30小时没有完整成功的备份"}
      - alert: BackupAttemptFailed
        expr: ai_order_backup_last_attempt_success == 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "最近一次备份或已启用的额外副本校验失败"}
      - alert: BackupDiskLow
        expr: ai_order_backup_filesystem_available_bytes < 5368709120
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "备份所在文件系统可用空间低于5GiB"}
      - alert: AgentAuditWriteFailure
        expr: increase(agent_audit_write_failures_total[5m]) > 0 or increase(agent_audit_queue_dropped_total[5m]) > 0
        labels: {severity: warning}
        annotations: {summary: "Agent指标日志写入失败或队列丢弃，业务结果未被遮蔽"}
      - alert: AgentQuotaSettlementFailure
        expr: increase(agent_quota_settlement_failures_total[5m]) > 0
        labels: {severity: warning}
        annotations: {summary: "AI额度结算失败，已保守保留预扣额度"}
  - name: campus-commerce
    rules:
      - alert: CampusCommerceInvariantViolation
        expr: campus_inventory_negative > 0 or campus_reservation_invalid > 0 or campus_refund_invalid > 0 or campus_coupon_stale_locks > 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "校园交易库存、预约、退款或优惠锁定异常"}
      - alert: CampusDeliveryExceptions
        expr: campus_delivery_exceptions > 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "校园配送存在待人工处理异常"}
      - alert: CampusCompensationFailure
        expr: increase(campus_operation_failures_total{operation="expire_compensation"}[5m]) > 0
        labels: {severity: critical}
        annotations: {summary: "校园结算超时补偿失败，需要检查异常列表与流水"}
  - name: orders
    rules:
      - alert: ServiceUnavailable
        expr: up == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Service unavailable for one minute"}
      - alert: GatewayServerErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) > 0.01
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Gateway 5xx rate above 1 percent"}
      - alert: DatabasePoolWait
        expr: hikaricp_connections_pending > 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Requests waiting for database connections"}
