groups:
  - name: orders
    rules:
      - alert: ServiceUnavailable
        expr: up == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Service unavailable for one minute"}
      - alert: GatewayServerErrors
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) > 0.01
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Gateway 5xx rate above 1 percent"}
      - alert: DatabasePoolWait
        expr: hikaricp_connections_pending > 0
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Requests waiting for database connections"}
