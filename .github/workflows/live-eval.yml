name: Live Agent Evaluation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: '验收入口；均使用隔离环境和本轮付费上限'
        required: true
        type: choice
        default: campus
        options: [campus, legacy]
      runs:
        description: '场景重复次数（1-3，共享60次请求/150000预算单位）'
        required: false
        default: '1'

jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Create capped isolated deployment
        env:
          CAMPUS_EVAL_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          CAMPUS_EVAL_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          CAMPUS_EVAL_LLM_MODEL: ${{ secrets.LLM_MODEL }}
          CAMPUS_EVAL_RUN_ID: ${{ github.run_id }}
          APP_REVISION: ${{ github.sha }}
          EVALUATION_RUNS: ${{ inputs.runs }}
        run: |
          case "$EVALUATION_RUNS" in 1|2|3) ;; *) echo 'runs must be 1-3' >&2; exit 1 ;; esac
          test -n "$CAMPUS_EVAL_LLM_API_KEY" && test -n "$CAMPUS_EVAL_LLM_BASE_URL" && test -n "$CAMPUS_EVAL_LLM_MODEL"
          mkdir -p .local/live-eval load/results/live-eval
          umask 077
          cp .github/compose-ci.env .local/live-eval.env
          printf '%s\n' "CAMPUS_EVAL_LLM_API_KEY=$CAMPUS_EVAL_LLM_API_KEY" "CAMPUS_EVAL_LLM_BASE_URL=$CAMPUS_EVAL_LLM_BASE_URL" "CAMPUS_EVAL_LLM_MODEL=$CAMPUS_EVAL_LLM_MODEL" "CAMPUS_EVAL_RUN_ID=$CAMPUS_EVAL_RUN_ID" "APP_REVISION=$APP_REVISION" >> .local/live-eval.env
          docker compose --env-file .local/live-eval.env -p ai-order-eval -f docker-compose.yml -f deploy/compose/isolated.yml -f deploy/compose/model-eval.yml up --build -d --wait --wait-timeout 240
          python -m pip install httpx==0.28.1
      - name: Campus six-scenario evaluation
        if: inputs.suite == 'campus'
        env:
          EVALUATION_RUNS: ${{ inputs.runs }}
        run: |
          for i in $(seq 1 "$EVALUATION_RUNS"); do
            python scripts/test-campus-live-model.py --project ai-order-eval --env-file .local/live-eval.env --revision "$GITHUB_SHA" --fixture ".local/live-eval/fixture-$i.json" --report "load/results/live-eval/campus-$i.json"
          done
      - name: Legacy evaluation
        if: inputs.suite == 'legacy'
        env:
          EVALUATION_RUNS: ${{ inputs.runs }}
        run: docker compose --env-file .local/live-eval.env -p ai-order-eval -f docker-compose.yml exec -T agent python evals/run_live_eval.py --runs "$EVALUATION_RUNS" --results-file /app/metrics/live-eval-results.jsonl
      - name: Export sanitized ledger and legacy artifacts
        if: always()
        run: |
          mkdir -p load/results/live-eval
          docker compose --env-file .local/live-eval.env -p ai-order-eval -f docker-compose.yml exec -T agent python -c 'import json; from app.evaluation import status; print(json.dumps(status()))' > load/results/live-eval/evaluation-budget.json || true
          if [ '${{ inputs.suite }}' = legacy ]; then
            container="$(docker compose --env-file .local/live-eval.env -p ai-order-eval -f docker-compose.yml ps -q agent)"
            docker cp "$container:/app/metrics/live-eval-results.jsonl" load/results/live-eval/legacy-results.jsonl || true
            docker cp "$container:/app/metrics/live-eval-results.summary.json" load/results/live-eval/legacy-summary.json || true
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: live-eval-results
          path: load/results/live-eval/
          if-no-files-found: warn
      - name: Stop isolated services
        if: always()
        run: docker compose --env-file .local/live-eval.env -p ai-order-eval -f docker-compose.yml -f deploy/compose/isolated.yml -f deploy/compose/model-eval.yml stop
