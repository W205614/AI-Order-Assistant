name: Dependency and image security
on:
  push:
  pull_request:
  schedule: [{cron: '0 3 * * 1'}]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      APP_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13'}
      - name: Verify deployment scanner coverage and failure gates
        run: python -B -m unittest discover -s scripts -p test_scan_deployment_images.py -v
      - name: Build clean runtime images
        run: APP_DOMAIN=example.invalid docker compose --env-file .github/compose-ci.env -p ai-order-assistant -f docker-compose.yml -f deploy/compose/public.yml build
      - name: Scan every resolved local and public deployment image
        run: python -X utf8 -B scripts/scan_deployment_images.py --env-file .github/compose-ci.env --output-directory security-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with: {name: dependency-image-scan, path: security-reports, if-no-files-found: error}
