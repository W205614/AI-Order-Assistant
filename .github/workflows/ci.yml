name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: agent-service/requirements.txt}
      - run: mvn -q test
        working-directory: java-gateway
      - run: pip install -r requirements.txt && python -m compileall -q app
        working-directory: agent-service
