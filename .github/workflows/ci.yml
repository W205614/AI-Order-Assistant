name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      APP_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: {distribution: temurin, java-version: '21', cache: maven}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: agent-service/requirements.txt}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '22'}
      - name: Validate static browser scripts
        run: node scripts/check-static-js.mjs
      - name: Verify event subscription lifecycle
        run: node scripts/test-event-subscriptions.cjs
      - name: Validate Compose configurations
        run: python scripts/check-compose.py
      - name: Build patched infrastructure runtimes
        run: APP_DOMAIN=example.invalid docker compose --env-file .github/compose-ci.env -p ai-order-assistant -f docker-compose.yml -f deploy/compose/public.yml build mysql proxy
      - name: Verify backup shell supervision
        shell: bash
        run: |
          mkdir -p load/results
          python scripts/test-backup-shell.py 2>&1 | tee load/results/backup-shell.log
      - name: Verify read-only operation checks
        shell: bash
        run: pwsh -NoProfile -File scripts/test-operations.ps1 2>&1 | tee load/results/operations.log
      - name: Verify backup process supervision
        shell: bash
        run: pwsh -NoProfile -File scripts/test-backup-process.ps1 2>&1 | tee load/results/backup-process.log
      - name: Verify proxy request body bounds
        shell: bash
        run: CADDY_TEST_IMAGE=ai-order-assistant-proxy:latest python scripts/test-caddy-body-limit.py 2>&1 | tee load/results/caddy-body-limit.log
      - name: Validate operational alert rules
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy/alerts.yml:/alerts.yml:ro" prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2 check rules /alerts.yml
      - name: Require Docker for integration tests
        run: docker info
      - id: maven
        run: mvn -q test
        working-directory: java-gateway
      - name: Verify MySQL integration tests were not skipped
        working-directory: java-gateway
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = {
              "TEST-com.ai.assistant.service.CampusCommerceMySqlIntegrationTest.xml",
              "TEST-com.ai.assistant.service.OrderBusinessMySqlIntegrationTest.xml",
              "TEST-db.migration.FlywayMigrationIntegrationTest.xml",
              "TEST-com.ai.assistant.service.CampusFulfillmentMySqlIntegrationTest.xml",
              "TEST-com.ai.assistant.service.CheckoutResponseMySqlIntegrationTest.xml",
          }
          reports = Path("target/surefire-reports")
          missing = [name for name in expected if not (reports / name).is_file()]
          skipped = []
          for name in expected - set(missing):
              suite = ET.parse(reports / name).getroot()
              count = int(suite.get("skipped", "0"))
              if count:
                  skipped.append(f"{name}: skipped={count}")
          if missing or skipped:
              raise SystemExit("MySQL integration tests must run in CI; " + "; ".join(missing + skipped))
          PY
      - name: Publish Maven test failure details
        if: failure() && steps.maven.outcome == 'failure'
        shell: bash
        working-directory: java-gateway
        run: |
          shopt -s nullglob
          reports=(target/surefire-reports/*.txt)
          if ((${#reports[@]} == 0)); then
            echo "::error title=Maven test failure::Surefire did not generate a report. Inspect the Maven step output."
            exit 0
          fi
          for report in "${reports[@]}"; do
            while IFS= read -r line; do
              echo "::error file=${report},title=Surefire failure::${line}"
            done < <(grep -E '<<< (FAILURE|ERROR)!|Caused by:|AssertionFailedError|Exception:' "${report}" | head -n 20 || true)
          done
      - run: pip install -r requirements.txt -r requirements.lock.txt && pip check && python -m compileall -q app && python -m unittest discover -s tests -v
        working-directory: agent-service
      - name: Verify budget accounting against disposable Redis
        working-directory: agent-service
        run: |
          docker run -d --name ai-order-budget-ci --memory 64m --cpus 0.25 -p 127.0.0.1:16379:6379 redis:7.4.12-alpine@sha256:338fbfc036dc5517ac0b04d6de21521085935336e565f223406180e9d84166e2
          trap 'docker rm -f ai-order-budget-ci >/dev/null' EXIT
          for i in {1..30}; do
            if docker exec ai-order-budget-ci redis-cli ping | grep -q PONG; then break; fi
            sleep 1
          done
          AGENT_TEST_REDIS_URL=redis://127.0.0.1:16379/0 python -m unittest discover -s tests -p test_stability_accounting.py -k RedisAccountingIntegrationTest -v
          AGENT_TEST_REDIS_URL=redis://127.0.0.1:16379/0 python -m unittest discover -s tests -p test_evaluation_budget.py -k EvaluationRedisTest -v
      - name: Build clean disposable deployment and verify HTTP contracts
        run: |
          docker compose --env-file .github/compose-ci.env -p ai-order-clean -f docker-compose.yml -f deploy/compose/isolated.yml up --build -d --wait --wait-timeout 180
          python scripts/check-agent-security.py --project ai-order-clean
          python scripts/test-functional-concurrency.py --base-url http://127.0.0.1:19090 --report load/results/functional-concurrency.json
          python scripts/test-roles-and-isolation.py --base-url http://127.0.0.1:19090 --report load/results/roles-and-isolation.json
      - name: Verify complete browser workflows
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" --no-save --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install --with-deps chromium
          node scripts/test-campus-recovery.cjs "$RUNNER_TEMP/browser/node_modules/playwright"
          node scripts/test-campus-event-edit.cjs "$RUNNER_TEMP/browser/node_modules/playwright"
          node scripts/test-fulfillment-lists.cjs "$RUNNER_TEMP/browser/node_modules/playwright"
          node scripts/test-browser.cjs --base-url http://127.0.0.1:19090 --playwright-module "$RUNNER_TEMP/browser/node_modules/playwright" --report load/results/browser-full.json
          node scripts/test-campus-browser.cjs --base-url http://127.0.0.1:19090 --playwright-module "$RUNNER_TEMP/browser/node_modules/playwright" --report load/results/campus-browser.json
          node scripts/test-role-experience.cjs --base-url http://127.0.0.1:19090 --playwright-module "$RUNNER_TEMP/browser/node_modules/playwright" --report load/results/role-experience.json
          node scripts/test-campus-safety.cjs --base-url http://127.0.0.1:19090 --playwright-module "$RUNNER_TEMP/browser/node_modules/playwright" --report load/results/campus-safety.json
          node scripts/test-ui-quality.cjs --base-url http://127.0.0.1:19090 --playwright-module "$RUNNER_TEMP/browser/node_modules/playwright" --report load/results/ui-quality.json
          python scripts/test-campus-load.py --base-url http://127.0.0.1:19090 --report load/results/campus-load.json
          python scripts/check-load-invariants.py --project ai-order-clean --output load/results/campus-stock-invariants.json
      - name: Show deployment failure details
        if: failure()
        run: docker compose --env-file .github/compose-ci.env -p ai-order-clean -f docker-compose.yml -f deploy/compose/isolated.yml logs --tail 100 gateway agent
      - name: Preserve verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-reports-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            load/results/backup-shell.log
            load/results/operations.log
            load/results/backup-process.log
            load/results/caddy-body-limit.log
            load/results/functional-concurrency.json
            load/results/roles-and-isolation.json
            load/results/browser-full.json
            load/results/campus-browser.json
            load/results/role-experience.json
            load/results/campus-safety.json
            load/results/ui-quality.json
            load/results/campus-load.json
            load/results/campus-stock-invariants.json
            java-gateway/target/surefire-reports/TEST-*.xml
            java-gateway/target/surefire-reports/*.txt
      - name: Remove disposable CI volumes
        if: always()
        run: docker compose --env-file .github/compose-ci.env -p ai-order-clean -f docker-compose.yml -f deploy/compose/isolated.yml down -v
