name: Prepare reviewed source materials
on:
  push:
    paths:
      - .github/workflows/prepare-license-materials.yml
      - licenses/container-source-inputs.json
  workflow_dispatch:
permissions: { contents: read }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: { python-version: "3.13" }
      - name: Verify fixed source digests and archive boundaries
        run: python -B -m unittest discover -s scripts -p test_distribution_materials.py -v
      - name: Fetch reviewed runtime source inputs
        run: python -B scripts/fetch-distribution-materials.py --lock licenses/container-source-inputs.json --output materials
      - name: Preserve source materials and verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reviewed-source-materials-${{ github.sha }}
          path: materials
          if-no-files-found: error
          retention-days: 14
