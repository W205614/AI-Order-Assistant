name: Prepare reviewed source materials
on:
  push:
    paths:
      - .github/workflows/prepare-license-materials.yml
      - licenses/container-os-sources.lock.json
      - licenses/go-additional-source-inputs.json
      - scripts/fetch-distribution-materials.py
      - scripts/build-distribution-bundle.py
      - scripts/publish-source-materials.py
      - scripts/test_distribution_materials.py
      - scripts/test_distribution_bundle.py
  workflow_dispatch:
    inputs:
      scope:
        description: Reviewed source scope; legacy is v0.1.2, release-delta is v0.1.3
        required: true
        default: legacy
        type: choice
        options: [legacy, release-delta]
      publish:
        description: Append verified source/NOTICE assets to the existing public Release for the selected scope
        required: true
        default: false
        type: boolean
      prepared_run_id:
        description: Optional successful source-prepare run to promote without rebuilding
        required: false
        default: ""
        type: string
permissions: { contents: read, actions: read }
jobs:
  resolve_source:
    runs-on: ubuntu-latest
    outputs:
      source_run_id: ${{ steps.selection.outputs.source_run_id }}
      artifact_sha: ${{ steps.selection.outputs.artifact_sha }}
      reuse_prepared: ${{ steps.selection.outputs.reuse_prepared }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: { python-version: "3.13" }
      - name: Validate prepared-run provenance or select this running workflow
        id: selection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREPARED_RUN_ID: ${{ inputs.prepared_run_id || '' }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        run: python -B scripts/publish-source-materials.py --resolve-source-run
  prepare_os:
    needs: resolve_source
    if: needs.resolve_source.outputs.reuse_prepared != 'true' && (github.event_name == 'push' || inputs.scope == 'legacy')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: { python-version: "3.13" }
      - name: Check source and bundle integrity failure cases
        run: python -B -m unittest discover -s scripts -p 'test_distribution*.py' -v
      - name: Fetch all reviewed OS/runtime source and notice inputs
        run: python -B scripts/fetch-distribution-materials.py --lock licenses/container-os-sources.lock.json --output materials
      - name: Build complete original notices and read back every bundled file
        run: python -B scripts/build-distribution-bundle.py --lock licenses/container-os-sources.lock.json --materials materials --output bundle --kind os
      - name: Verify the append-only publication candidate without publishing
        run: python -B scripts/publish-source-materials.py --input bundle --kind os
      - name: Preserve complete source/notice candidate and verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: os-source-materials-${{ github.sha }}
          path: bundle
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  prepare_go_additional:
    needs: resolve_source
    if: needs.resolve_source.outputs.reuse_prepared != 'true' && (github.event_name == 'push' || inputs.scope == 'legacy')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: { python-version: "3.13" }
      - name: Check source and bundle integrity failure cases
        run: python -B -m unittest discover -s scripts -p 'test_distribution*.py' -v
      - name: Fetch independent additional Go sources
        run: python -B scripts/fetch-distribution-materials.py --lock licenses/go-additional-source-inputs.json --output materials
      - name: Build additional Go original notices and verify every bundled file
        run: python -B scripts/build-distribution-bundle.py --lock licenses/go-additional-source-inputs.json --materials materials --output bundle --kind go-additional
      - name: Verify the append-only publication candidate without publishing
        run: python -B scripts/publish-source-materials.py --input bundle --kind go-additional
      - name: Preserve complete additional Go source/notice candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: go-additional-source-materials-${{ github.sha }}
          path: bundle
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  prepare_release_delta:
    needs: resolve_source
    if: needs.resolve_source.outputs.reuse_prepared != 'true' && github.event_name == 'workflow_dispatch' && inputs.scope == 'release-delta'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: { python-version: "3.13" }
      - name: Check source and bundle integrity failure cases
        run: python -B -m unittest discover -s scripts -p 'test_distribution*.py' -v
      - name: Fetch the reviewed 0.1.3 release source and notice delta
        run: python -B scripts/fetch-distribution-materials.py --lock licenses/release-delta-source-inputs.json --output materials
      - name: Build the 0.1.3 original notices and verify every delta member
        run: python -B scripts/build-distribution-bundle.py --lock licenses/release-delta-source-inputs.json --materials materials --output bundle --kind release-delta --version 0.1.3
      - name: Verify the append-only publication candidate without publishing
        run: python -B scripts/publish-source-materials.py --input bundle --kind release-delta --version 0.1.3
      - name: Preserve the complete 0.1.3 delta candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-delta-source-materials-${{ github.sha }}
          path: bundle
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  publish_os:
    needs: [resolve_source, prepare_os]
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.scope == 'legacy' && inputs.publish && needs.resolve_source.result == 'success' && (needs.prepare_os.result == 'success' || needs.resolve_source.outputs.reuse_prepared == 'true')
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: { python-version: "3.13" }
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: os-source-materials-${{ needs.resolve_source.outputs.artifact_sha }}
          path: bundle
          run-id: ${{ needs.resolve_source.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Append identical verified OS source assets and verify anonymous downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ needs.resolve_source.outputs.source_run_id }}
          SOURCE_HEAD_SHA: ${{ needs.resolve_source.outputs.artifact_sha }}
        run: python -B scripts/publish-source-materials.py --input bundle --kind os --publish
      - name: Preserve publication receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: os-source-publication-${{ github.sha }}
          path: bundle/source-publication.json
          if-no-files-found: warn
          retention-days: 14
  publish_go_additional:
    needs: [resolve_source, prepare_go_additional]
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.scope == 'legacy' && inputs.publish && needs.resolve_source.result == 'success' && (needs.prepare_go_additional.result == 'success' || needs.resolve_source.outputs.reuse_prepared == 'true')
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: { python-version: "3.13" }
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: go-additional-source-materials-${{ needs.resolve_source.outputs.artifact_sha }}
          path: bundle
          run-id: ${{ needs.resolve_source.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Append identical verified additional Go assets and verify anonymous downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ needs.resolve_source.outputs.source_run_id }}
          SOURCE_HEAD_SHA: ${{ needs.resolve_source.outputs.artifact_sha }}
        run: python -B scripts/publish-source-materials.py --input bundle --kind go-additional --publish
      - name: Preserve publication receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: go-additional-source-publication-${{ github.sha }}
          path: bundle/source-publication.json
          if-no-files-found: warn
          retention-days: 14
  publish_release_delta:
    needs: [resolve_source, prepare_release_delta]
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.scope == 'release-delta' && inputs.publish && needs.resolve_source.result == 'success' && (needs.prepare_release_delta.result == 'success' || needs.resolve_source.outputs.reuse_prepared == 'true')
    runs-on: ubuntu-latest
    permissions: { contents: write, actions: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: { python-version: "3.13" }
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: release-delta-source-materials-${{ needs.resolve_source.outputs.artifact_sha }}
          path: bundle
          run-id: ${{ needs.resolve_source.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Append verified 0.1.3 delta assets and verify anonymous downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ needs.resolve_source.outputs.source_run_id }}
          SOURCE_HEAD_SHA: ${{ needs.resolve_source.outputs.artifact_sha }}
        run: python -B scripts/publish-source-materials.py --input bundle --kind release-delta --version 0.1.3 --publish
      - name: Preserve publication receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-delta-source-publication-${{ github.sha }}
          path: bundle/source-publication.json
          if-no-files-found: warn
          retention-days: 14
