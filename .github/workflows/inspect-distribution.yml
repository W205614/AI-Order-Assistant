name: Inspect historical image distribution
on:
  push:
    paths:
      - .github/workflows/inspect-distribution.yml
  workflow_dispatch:
permissions: { contents: read, actions: read }
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: { python-version: "3.13" }
      - name: Verify layer inspection boundaries and integrity checks
        run: python -B -m unittest discover -s scripts -p test_distribution_images.py -v
      - name: Inspect retained archives without starting applications
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B scripts/inspect-distribution-images.py --inventory licenses/historical-ci-images.json --output inspection --scratch "$RUNNER_TEMP/image-inspection"
      - name: Preserve metadata and notices, without executable payloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: historical-image-inspection-${{ github.sha }}
          path: inspection
          if-no-files-found: error
          retention-days: 14
