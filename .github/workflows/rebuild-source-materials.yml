name: Reproduce frozen source assets
on:
  workflow_dispatch:
permissions: { contents: read }
jobs:
  rebuild:
    strategy:
      fail-fast: false
      matrix:
        kind: [go-base, agent]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: { python-version: "3.13" }
      - name: Reproduce identical reviewed bytes from public sources
        run: python -B scripts/rebuild-reviewed-source.py --kind "${{ matrix.kind }}" --output reproduced
      - name: Append the identical asset and verify its anonymous download
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -B scripts/rebuild-reviewed-source.py --kind "${{ matrix.kind }}" --output reproduced --publish
      - name: Preserve reproducibility and publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reproduced-${{ matrix.kind }}-${{ github.sha }}
          path: |
            reproduced/*.verification.json
            reproduced/publication.json
          if-no-files-found: warn
          retention-days: 14
