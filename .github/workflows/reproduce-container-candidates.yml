name: Reproduce reviewed container candidates
on:
  workflow_dispatch:
permissions: { contents: read, actions: read }
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: { contents: write, actions: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: { python-version: "3.13" }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version: "1.25.3", cache: false }
      - name: Reassemble exact reviewed bytes from fixed public payloads
        run: python -B scripts/reproduce-container-candidates.py --output reconstructed
      - name: Append the same verified candidate after required CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -B scripts/reproduce-container-candidates.py --output reconstructed --publish
      - name: Preserve identity and publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: container-candidate-reproduction-${{ github.sha }}
          path: |
            reconstructed/candidate-verification.json
            reconstructed/publication.json
            reconstructed/rebuilt/*verification*.json
          if-no-files-found: warn
          retention-days: 14
