name: Reproduce reviewed container candidates
on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version of the already verified immutable candidates
        required: true
        default: "0.1.3"
        type: choice
        options: ["0.1.3", "0.1.2"]
permissions: { contents: read, actions: read }
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: { contents: write, actions: read }
    env:
      CANDIDATE_MANIFEST: ${{ inputs.version == '0.1.2' && 'licenses/historical-v0.1.2-ghcr-candidates.json' || 'licenses/ghcr-candidates.json' }}
      CANDIDATE_SEED: ${{ inputs.version == '0.1.2' && 'licenses/container-candidate-seed.json' || 'licenses/container-candidate-seed-0.1.3.json' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: { python-version: "3.13" }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with: { go-version: "1.25.3", cache: false }
      - name: Reassemble exact reviewed bytes from fixed public payloads
        run: python -B scripts/reproduce-container-candidates.py --output reconstructed --manifest "$CANDIDATE_MANIFEST" --seed "$CANDIDATE_SEED"
      - name: Append the same verified candidate after required CI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -B scripts/reproduce-container-candidates.py --output reconstructed --manifest "$CANDIDATE_MANIFEST" --seed "$CANDIDATE_SEED" --publish
      - name: Preserve identity and publication evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: container-candidate-reproduction-${{ github.sha }}
          path: |
            reconstructed/candidate-verification.json
            reconstructed/publication.json
            reconstructed/rebuilt/*verification*.json
          if-no-files-found: warn
          retention-days: 14
