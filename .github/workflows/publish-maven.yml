name: Publish verified Maven package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag containing verified candidate assets
        required: true
        type: string
permissions:
  contents: read
  actions: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: "21"
          server-id: github
      - name: Fetch and publish the verified candidate without rebuilding
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/publish-maven.py
      - name: Preserve package download verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: maven-publication-${{ github.sha }}
          path: .local/maven-publication/receipt.json
          if-no-files-found: warn
          retention-days: 14
