name: Publish verified application containers
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  packages: write
concurrency:
  group: publish-verified-application-containers
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: { python-version: "3.13" }
      - name: Promote fixed candidates after CI without rebuilding
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -X utf8 -B scripts/publish-container-images.py --output "$RUNNER_TEMP/container-publication"
      - name: Preserve publication and authenticated pull verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ghcr-publication-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/container-publication/*.json
          if-no-files-found: warn
          retention-days: 14
