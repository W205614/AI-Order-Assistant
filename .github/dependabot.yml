version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /agent-service
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /java-gateway
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /agent-service
      - /java-gateway
      - /deploy/caddy
      - /deploy/mysql
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
