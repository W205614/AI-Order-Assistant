<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平台运营台 · 校园点餐</title><meta name="description" content="管理校区与店铺，跟进配送、优惠活动和待处理异常。"><link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><link rel="stylesheet" href="/assets/app.css"><script type="module" src="/assets/platform.js"></script></head><body class="platform-page"><a class="skip-link" href="#main">跳至主要内容</a><header><a class="brand" href="/campus/" aria-label="校园点餐首页"><span class="brand-mark" aria-hidden="true">校</span><span>校园点餐<small>CAMPUS TABLE</small></span></a><nav class="role-nav" aria-label="使用入口"><a href="/campus/">校园点餐</a><a href="/chat/">单店助手</a><a href="/admin/">商户</a><a href="/platform/">平台</a><a href="/rider/">骑手</a></nav></header><div id="notice" role="status">正在加载</div><main id="main"><div class="page-intro compact"><div><p class="eyebrow">校园运营 / PLATFORM</p><h1>把校园服务，安排妥当。</h1><p class="intro-copy">管理校区与店铺，跟进配送、优惠活动和待处理异常。</p></div><span class="intro-index" aria-hidden="true">P</span></div><section id="auth"><h2>平台管理员登录</h2><p class="muted">初始化账号由部署人员提供。商户老板和顾客请使用各自入口。</p><form id="login"><input name="username" placeholder="账号" aria-label="账号" autocomplete="username" required maxlength="50"><input name="password" type="password" placeholder="密码" aria-label="密码" autocomplete="current-password" required maxlength="72"><button>登录</button></form></section><section id="account" hidden><p><span id="identity"></span> <button id="logout" type="button">退出登录</button></p><details><summary>修改密码</summary><form id="password"><input name="oldPassword" type="password" placeholder="原密码" aria-label="原密码" autocomplete="current-password" required><input name="newPassword" type="password" placeholder="新密码至少 12 位" aria-label="新密码至少 12 位" autocomplete="new-password" minlength="12" required><button>修改并退出</button></form></details></section><div id="workspace" hidden><nav class="task-nav" aria-label="工作区导航"><a href="#commerceManagement">校园平台运营</a><a href="#merchantManagement">开通商户</a><a href="#customerManagement">顾客账户状态</a><a href="#platformAudit">平台审计</a></nav>
<section id="merchantManagement"><h2>开通商户</h2><p class="muted">开通后将老板账号交给商家，由老板设置营业时间、配送区域和菜单。</p><form id="provision"><input name="name" placeholder="商户名称" aria-label="商户名称" required maxlength="100"><input name="ownerUsername" placeholder="老板账号" aria-label="老板账号" required maxlength="50"><input name="ownerPassword" type="password" placeholder="初始密码至少 12 位" aria-label="初始密码至少 12 位" minlength="12" required autocomplete="new-password"><button>开通</button></form><button id="refresh" type="button">刷新</button><div id="merchants" class="grid"></div></section>
<section id="customerManagement"><h2>顾客账户状态</h2><form id="customerEnable"><input name="userId" type="number" min="1" placeholder="顾客 ID" aria-label="顾客 ID" required><select name="enabled" aria-label="顾客账户状态"><option value="false">停用并使登录失效</option><option value="true">启用</option></select><button>更新状态</button></form></section>
