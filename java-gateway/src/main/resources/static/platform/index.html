<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>平台管理</title><link rel="stylesheet" href="/assets/app.css"><script type="module" src="/assets/platform.js"></script></head><body><header><div><h1>平台管理</h1><span class="muted">每商户一店 · 模拟支付 · 商家手动履约</span></div><nav><a href="/chat/">顾客点餐</a><a href="/admin/">商户后台</a><a href="/platform/">平台管理</a></nav></header><div id="notice" role="status">正在加载</div><main><section id="auth"><h2>登录</h2><form id="login"><input name="username" placeholder="账号" autocomplete="username" required maxlength="50"><input name="password" type="password" placeholder="密码" autocomplete="current-password" required maxlength="72"><button>登录</button></form></section><section id="account" hidden><p><span id="identity"></span> <button id="logout" type="button">退出登录</button></p><details><summary>修改密码</summary><form id="password"><input name="oldPassword" type="password" placeholder="原密码" autocomplete="current-password" required><input name="newPassword" type="password" placeholder="新密码至少 12 位" autocomplete="new-password" minlength="12" required><button>修改并退出</button></form></details></section><div id="workspace" hidden>
<section><h2>开通商户</h2><form id="provision"><input name="name" placeholder="商户名称" required maxlength="100"><input name="ownerUsername" placeholder="老板账号" required maxlength="50"><input name="ownerPassword" type="password" placeholder="初始密码至少 12 位" minlength="12" required autocomplete="new-password"><button>开通</button></form><button id="refresh" type="button">刷新</button><div id="merchants" class="grid"></div></section>
<section><h2>顾客账户状态</h2><form id="customerEnable"><input name="userId" type="number" min="1" placeholder="顾客 ID" required><select name="enabled"><option value="false">停用并使登录失效</option><option value="true">启用</option></select><button>更新状态</button></form></section>
<section><h2>平台审计</h2><div id="audit"></div></section></div></main></body></html>
