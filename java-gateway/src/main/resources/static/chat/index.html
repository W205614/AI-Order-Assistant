<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 点餐助手</title><link rel="stylesheet" href="/assets/app.css"><script type="module" src="/assets/customer.js"></script></head><body><header><div><h1>AI 点餐助手</h1><span class="muted">每商户一店 · 模拟支付 · 商家手动履约</span></div><nav><a href="/chat/">顾客点餐</a><a href="/admin/">商户后台</a><a href="/platform/">平台管理</a></nav></header><div id="notice" role="status">正在加载</div><main><section id="auth"><h2>顾客登录</h2><p class="muted">首次使用可注册顾客账号。登录后选择商户，再添加菜品。</p><form id="login"><input name="username" placeholder="账号" autocomplete="username" required maxlength="50"><input name="password" type="password" placeholder="密码" autocomplete="current-password" required maxlength="72"><button>登录</button></form><details><summary>注册顾客账号</summary><form id="register"><input name="username" placeholder="字母、数字或下划线账号" required minlength="3" maxlength="50"><input name="password" type="password" placeholder="密码至少 12 位" required minlength="12" autocomplete="new-password"><input name="nickname" placeholder="昵称" maxlength="50"><button>注册</button></form></details></section><section id="account" hidden><p><span id="identity"></span> <button id="logout" type="button">退出登录</button></p><details><summary>修改密码</summary><form id="password"><input name="oldPassword" type="password" placeholder="原密码" autocomplete="current-password" required><input name="newPassword" type="password" placeholder="新密码至少 12 位" autocomplete="new-password" minlength="12" required><button>修改并退出</button></form></details></section><div id="workspace" hidden>
<section><label>选择商户 <select id="merchant"></select></label> <span id="shopState"></span> <button id="refresh" type="button">刷新</button> <a class="checkout-link" href="#checkout">去结算（<span id="cartCount">0</span> 件）</a></section>
<div class="columns"><div>
<section><h2>菜单</h2><input id="keyword" placeholder="搜索菜名" maxlength="100"><button id="search" type="button">搜索</button><div id="menu" class="grid customer-menu" tabindex="0" aria-label="菜品列表"></div></section>
<section id="checkout"><h2>购物车与确认</h2><div id="cart"></div><form id="cartForm"><input id="remark" name="remark" placeholder="整单备注" maxlength="255"><button>保存待确认草稿</button></form><h3>收货信息</h3><form id="receipt"><label>收货人<input name="recipientName" autocomplete="name" required maxlength="50"></label><label>手机号<input name="recipientPhone" type="tel" autocomplete="tel" placeholder="11 位手机号" pattern="1[0-9]{10}" required maxlength="11"></label><label>详细地址<input name="deliveryAddress" autocomplete="street-address" placeholder="楼栋、楼层与门牌" required maxlength="255"></label><label>配送区域<select id="region" name="deliveryRegion" required></select></label></form><div id="draft"></div><p class="muted">确认后预留库存，十分钟内完成模拟支付。制作前可取消；模拟支付和退款不发生真实资金转移。</p></section>
<section id="myOrders"><h2>我的订单</h2><select id="orderStatus"><option value="">全部订单</option><option value="0">待模拟支付</option><option value="1">待处理</option><option value="2">制作中</option><option value="3">配送中</option><option value="4">完成</option><option value="5">取消</option><option value="6">超时</option></select><span id="orderCount"></span><button id="prev" type="button">上一页</button><button id="next" type="button">下一页</button><div id="orders" class="grid"></div></section>
</div><div>
<section><h2>本次过敏约束</h2><p id="safetyState" class="muted"></p><form id="allergy"><label><input type="checkbox" value="花生">花生</label><label><input type="checkbox" value="鸡蛋">鸡蛋</label><label><input type="checkbox" value="麸质">麸质</label><button>明确本次约束</button></form><button id="clearSafety" type="button">清除本次约束</button><p class="muted">其他过敏原暂不能核验。存在待确认草稿时须先放弃草稿；制作前仍需向店员确认交叉接触风险。</p></section>
<section><h2>AI 助手</h2><p class="muted">AI 不可用时可直接使用菜单完成点餐。</p><div id="messages"></div><form id="chatForm"><textarea id="message" name="message" placeholder="例如：我要一份鱼香肉丝饭" required maxlength="2000"></textarea><button>发送</button></form></section>
<section><details><summary>长期饮食偏好</summary><form id="preferences"><input name="allergens" placeholder="长期过敏原（逗号分隔）" maxlength="255"><input name="dislikes" placeholder="不喜欢的食材" maxlength="255"><input name="dietaryGoal" placeholder="饮食目标" maxlength="255"><input name="budget" type="number" placeholder="单餐预算" step=".01" min=".01" max="9999"><button>保存长期偏好</button></form></details></section>
</div></div></div></main></body></html>
