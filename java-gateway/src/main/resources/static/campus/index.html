<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园多店点餐</title><link rel="stylesheet" href="/assets/app.css"><script type="module" src="/assets/campus-customer.js"></script></head>
<body><header><h1>校园多店点餐</h1><nav><a href="/chat/">单店点餐与过敏约束</a><a href="/admin/">商户</a><a href="/platform/">平台</a><a href="/rider/">骑手</a></nav></header><div id="notice" role="status">正在加载</div><main>
<section id="auth"><h2>顾客登录</h2><form id="login"><input name="username" placeholder="账号" autocomplete="username" required><input name="password" type="password" placeholder="密码" autocomplete="current-password" required><button>登录</button></form><details><summary>注册</summary><form id="register"><input name="username" placeholder="账号" required><input name="nickname" placeholder="昵称"><input name="password" type="password" placeholder="至少12位密码" minlength="12" required><button>注册</button></form></details></section>
<section id="account" hidden><span id="identity"></span><button id="logout" type="button">退出</button><details><summary>修改密码</summary><form id="password"><input name="oldPassword" type="password" placeholder="原密码" required><input name="newPassword" type="password" placeholder="新密码至少12位" minlength="12" required><button>保存并退出</button></form></details></section>
<div id="workspace" hidden>
<section><h2>收货与校区</h2><label>目的校区<select id="campus"></select></label><label>履约方式<select id="mode"><option value="DELIVERY">配送</option><option value="PICKUP">到店自提</option></select></label><label>收货地址<select id="address"></select></label><div id="addresses"></div><details><summary>添加地址</summary><form id="addressForm"><input name="recipientName" placeholder="收货人" required maxlength="50"><input name="phone" placeholder="联系电话" required maxlength="30"><input name="detail" placeholder="楼栋、房间与配送说明" required maxlength="255"><button>保存当前校区地址</button></form></details></section>
<section><h2>选店与菜单</h2><label>店铺<select id="shop"></select></label><button id="refresh" type="button">刷新</button><div id="campusMenu" class="grid"></div></section>
<section><h2>跨店购物车</h2><p class="muted">勾选需要结算的店铺。每家店独立出餐、配送或自提。</p><div id="campusCart"></div><label>平台券<select id="platformCoupon"></select></label><button id="quoteButton" type="button">计算所选店铺报价</button><div id="quote"></div></section>
<section><h2>优惠券</h2><div id="couponList" class="grid"></div></section>
<section><h2>我的结算与订单</h2><div id="checkoutList"></div></section>
<section><h2>收藏与反馈</h2><div id="favoriteList"></div><div id="feedbackList"></div></section>
<section><h2>AI 跨店助手</h2><p class="muted">AI 可以准备购物车；下单和模拟支付需本人核对点击。无模型时仍可菜单点餐。</p><form id="campusChat"><textarea name="message" placeholder="例如：帮我在预算内搭配饭和饮料" required maxlength="2000"></textarea><button>发送</button></form><div id="campusMessages"></div><h3>按预算查找组合</h3><form id="recommendForm"><input name="budget" type="number" min=".01" max="9999" step=".01" placeholder="含包装配送的预算" required><input name="keywords" placeholder="1-3个关键词，逗号分隔，例如：饭,茶" required><button>查找组合</button></form><div id="recommendations"></div></section>
</div></main></body></html>
