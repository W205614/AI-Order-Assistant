<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园骑手</title><link rel="stylesheet" href="/assets/app.css"><script type="module" src="/assets/rider.js"></script></head><body><header><h1>校园骑手</h1><nav><a href="/campus/">点餐</a><a href="/platform/">平台</a></nav></header><div id="notice" role="status">正在加载</div><main><section id="auth"><h2>骑手登录</h2><p>账号和服务校区由平台开通。</p><form id="login"><input name="username" placeholder="账号" autocomplete="username" required><input name="password" type="password" placeholder="密码" autocomplete="current-password" required><button>登录</button></form></section><section id="account" hidden><span id="identity"></span><button id="logout" type="button">退出</button><details><summary>修改密码</summary><form id="password"><input name="oldPassword" type="password" placeholder="原密码" required><input name="newPassword" type="password" placeholder="新密码至少12位" minlength="12" required><button>保存并退出</button></form></details></section><div id="workspace" hidden><section><h2>任务池与我的配送</h2><button id="refresh" type="button">刷新任务</button><div id="tasks" class="grid"></div></section></div></main></body></html>
