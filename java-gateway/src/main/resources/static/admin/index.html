<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商户经营后台</title><link rel="stylesheet" href="/assets/app.css"><script type="module" src="/assets/merchant.js"></script></head><body><header><div><h1>商户经营后台</h1><span class="muted">每商户一店 · 模拟支付 · 商家手动履约</span></div><nav><a href="/chat/">顾客点餐</a><a href="/admin/">商户后台</a><a href="/platform/">平台管理</a></nav></header><div id="notice" role="status">正在加载</div><main><section id="auth"><h2>商户登录</h2><p class="muted">老板账号由平台开通；店员账号由老板创建。店员登录后可处理本店订单。</p><form id="login"><input name="username" placeholder="账号" autocomplete="username" required maxlength="50"><input name="password" type="password" placeholder="密码" autocomplete="current-password" required maxlength="72"><button>登录</button></form></section><section id="account" hidden><p><span id="identity"></span> <button id="logout" type="button">退出登录</button></p><details><summary>修改密码</summary><form id="password"><input name="oldPassword" type="password" placeholder="原密码" autocomplete="current-password" required><input name="newPassword" type="password" placeholder="新密码至少 12 位" autocomplete="new-password" minlength="12" required><button>修改并退出</button></form></details></section><div id="workspace" hidden>
<section><h2>订单处理</h2><button id="refresh" type="button">刷新</button><select id="orderStatus"><option value="">全部订单</option><option value="0">待模拟支付</option><option value="1">待处理</option><option value="2">制作中</option><option value="3">配送中</option><option value="4">完成</option><option value="5">取消</option><option value="6">超时</option></select><span id="orderCount"></span><button id="prev" type="button">上一页</button><button id="next" type="button">下一页</button><div id="orders" class="grid"></div></section>
<section data-owner><h2>经营概况</h2><p id="stats"></p><p class="muted">完成金额仅统计已完成、已模拟支付订单。</p></section>
<section data-owner><h2>菜单与库存</h2><p id="dishMode">新增菜品</p><form id="dishForm"><input name="id" type="hidden"><input name="version" type="hidden"><input name="name" placeholder="菜名" required maxlength="100"><input name="price" type="number" placeholder="价格" step=".01" min=".01" required><input name="category" placeholder="分类" required maxlength="50"><input name="description" placeholder="描述" maxlength="255"><input name="allergens" placeholder="过敏标签（逗号分隔）" maxlength="255"><label><input id="dishReviewed" name="allergenReviewed" type="checkbox">标注已核验</label><input name="stock" type="number" placeholder="初始库存（编辑时不可改变）" min="0" max="1000000" required><select name="status"><option value="1">上架</option><option value="0">停售</option></select><button>保存菜品</button><button id="resetDish" type="button">清空表单</button></form><p class="muted">库存变动使用独立接口，版本冲突后需刷新。停售保留历史订单关联。</p><div id="menu" class="grid"></div></section>
<section data-owner><h2>营业设置</h2><form id="settings"><input name="name" placeholder="店名" required maxlength="100"><label>开始<input name="opensAt" type="time" required></label><label>结束<input name="closesAt" type="time" required></label><label><input id="accepting" name="acceptingOrders" type="checkbox">接受订单</label><input name="regions" placeholder="配送区域，逗号分隔" required><button>保存设置</button></form><p class="muted">开始与结束时间相同表示全天；支持跨午夜时段。</p></section>
<section data-owner><h2>店员管理</h2><form id="staffForm"><input name="username" placeholder="店员账号" required><input name="password" type="password" placeholder="初始密码至少 12 位" minlength="12" required autocomplete="new-password"><button>创建店员</button></form><div id="staff"></div><form id="staffPassword"><input name="staffId" type="number" placeholder="店员 ID" min="1" required><input name="password" type="password" placeholder="重置密码至少 12 位" minlength="12" required autocomplete="new-password"><button>重置并使旧登录失效</button></form></section>
<section data-owner><h2>操作审计</h2><div id="audit"></div></section></div></main></body></html>
