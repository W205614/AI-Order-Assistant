# 配置模板：推荐通过环境变量注入密码与密钥，不要把真实凭证写入仓库。
server:
  port: 9090
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: ai-order-assistant

  # MySQL 持久化（结构由 Flyway 版本化迁移管理）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_order_assistant?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    # 兼容 Flyway 引入前已有业务表的数据库：先记录基线 0，再执行 V1 起的增量迁移。
    baseline-on-migrate: true
    baseline-version: 0

  # 本地默认使用内存缓存；Docker 环境通过 CACHE_TYPE=redis 启用 Redis 菜单缓存。
  cache:
    type: ${CACHE_TYPE:simple}
    redis:
      time-to-live: 300000

ai:
  # Python Agent 服务
  agent-base-url: http://localhost:8800
  chat-path: /chat
  timeout-ms: 60000
  internal-api-key: ${AI_INTERNAL_API_KEY:}

# 鉴权（两个密钥必须不同，且至少32位）
auth:
  user-secret-key: ${JWT_USER_SECRET:}
  user-ttl: 86400000
  admin-secret-key: ${JWT_ADMIN_SECRET:}
  admin-ttl: 43200000

logging:
  level:
    com.ai.assistant: debug

# 演示菜单和弱密码演示账号只在本地演示时显式开启；生产环境保持 false。
app:
  demo-seed:
    enabled: ${DEMO_SEED_ENABLED:false}
