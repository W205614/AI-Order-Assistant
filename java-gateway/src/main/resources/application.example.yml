# 配置文件模板：复制为 application.yml 后，填写你自己的数据库账号密码即可使用。
#   Windows: copy application.example.yml application.yml
#   Linux/Mac: cp application.example.yml application.yml
server:
  port: 9090
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: ai-order-assistant

  # MySQL 持久化（首次启动自动建库建表+初始化菜单）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://你的主机:3306/ai_order_assistant?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: 你的数据库用户名
    password: 你的数据库密码

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

ai:
  # Python Agent 服务
  agent-base-url: http://localhost:8800
  chat-path: /chat
  timeout-ms: 60000

# 鉴权（JWT 密钥与过期时间，部署时请改为强随机值）
auth:
  user-secret-key: ai-order-user-secret-2026
  user-ttl: 86400000
  admin-secret-key: ai-order-admin-secret-2026
  admin-ttl: 43200000

logging:
  level:
    com.ai.assistant: debug
