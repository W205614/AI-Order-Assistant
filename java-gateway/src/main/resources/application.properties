# Safe runtime defaults kept outside developer-specific application.yml files.
# `baseline-on-migrate` lets a Flyway-enabled build adopt a legacy non-empty
# schema without deleting its existing orders, users, or inventory.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=0
spring.sql.init.mode=never
spring.datasource.hikari.connection-init-sql=SET time_zone = '+08:00', innodb_lock_wait_timeout = ${DB_LOCK_WAIT_SECONDS:5}
app.demo-seed.enabled=${DEMO_SEED_ENABLED:false}
server.port=${SERVER_PORT:9090}
server.shutdown=graceful
server.forward-headers-strategy=none
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_order_assistant?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:ai_order_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:3000}
spring.datasource.hikari.data-source-properties.connectTimeout=${DB_CONNECT_TIMEOUT_MS:3000}
spring.datasource.hikari.data-source-properties.socketTimeout=${DB_SOCKET_TIMEOUT_MS:10000}
app.database.timeout-seconds=${DB_QUERY_TIMEOUT_SECONDS:8}
events.sender-threads=${SSE_SENDER_THREADS:4}
events.queue-capacity=${SSE_QUEUE_CAPACITY:200}
commerce.recommendation.max-concurrent=${RECOMMEND_MAX_CONCURRENT:2}
commerce.recommendation.max-combinations=${RECOMMEND_MAX_COMBINATIONS:64}
spring.cache.type=${CACHE_TYPE:simple}
spring.cache.redis.time-to-live=300000
spring.data.redis.connect-timeout=1s
spring.data.redis.timeout=1s
ai.admission.redis-enabled=${AI_ADMISSION_REDIS_ENABLED:false}
ai.admission.max-concurrent=${AGENT_MAX_CONCURRENT:8}
ai.admission.user-concurrent=${AGENT_CAMPUS_USER_CONCURRENT:2}
ai.admission.per-minute=${AGENT_RATE_LIMIT_PER_MINUTE:30}
auth.user-secret-key=${JWT_USER_SECRET:}
auth.admin-secret-key=${JWT_ADMIN_SECRET:}
auth.user-ttl=7200000
auth.admin-ttl=1800000
auth.cookie-secure=${COOKIE_SECURE:false}
auth.monitoring-key=${MONITORING_API_KEY:}
ai.agent-base-url=${AI_AGENT_BASE_URL:http://localhost:8800}
ai.internal-api-key=${AI_INTERNAL_API_KEY:}
ai.timeout-ms=40000
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
spring.jackson.time-zone=Asia/Shanghai
logging.level.com.ai.assistant=INFO
app.bootstrap.username=${PLATFORM_ADMIN_USERNAME:}
app.bootstrap.password=${PLATFORM_ADMIN_PASSWORD:}
commerce.quote-cleanup.retention-hours=${CHECKOUT_QUOTE_RETENTION_HOURS:24}
commerce.quote-cleanup.batch-size=${CHECKOUT_QUOTE_CLEANUP_BATCH_SIZE:500}
commerce.quote-cleanup.delay-ms=${CHECKOUT_QUOTE_CLEANUP_DELAY_MS:3600000}
